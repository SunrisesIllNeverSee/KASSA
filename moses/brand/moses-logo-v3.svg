<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="35%" style="stop-color:#C9A84C"/>
      <stop offset="65%" style="stop-color:#E8C84C"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#1A1A22"/>
      <stop offset="100%" style="stop-color:#0A0A0F"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#0A0A0F"/>
  <rect x="40" y="40" width="520" height="520" rx="32" ry="32" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="40" y="40" width="520" height="520" rx="32" ry="32" filter="url(#noise)" opacity="0.4"/>
  <rect x="56" y="56" width="488" height="488" rx="22" ry="22" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.25"/>

  <text x="110" y="335" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">M</text>
  <text x="205" y="335" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">O</text>
  <text x="300" y="335" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">§</text>
  <text x="395" y="335" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">E</text>
  <text x="490" y="335" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">S</text>

  <text x="540" y="268" font-family="Playfair Display, Georgia, serif" font-size="28" font-weight="400" fill="#C9A84C" opacity="0.7">™</text>

  <line x1="78" y1="352" x2="540" y2="352" stroke="#C9A84C" stroke-width="0.7" opacity="0.3"/>
  <line x1="78" y1="240" x2="540" y2="240" stroke="#C9A84C" stroke-width="0.7" opacity="0.15"/>

  <text x="300" y="400" font-family="Courier New, DM Mono, monospace" font-size="14" fill="#C9A84C" opacity="0.5" text-anchor="middle" letter-spacing="6">COMMITMENT HAS PHYSICS</text>
</svg>