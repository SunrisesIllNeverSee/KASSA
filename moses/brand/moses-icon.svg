<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#E8C84C"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#151520"/>
      <stop offset="100%" style="stop-color:#0A0A0F"/>
    </radialGradient>
  </defs>

  <!-- Square -->
  <rect width="200" height="200" rx="24" ry="24" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  
  <!-- Inner border -->
  <rect x="12" y="12" width="176" height="176" rx="16" ry="16" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>

  <!-- § symbol as hero mark -->
  <text x="100" y="132" font-family="'Playfair Display', 'Georgia', serif" font-size="120" font-weight="700" fill="url(#gold)" text-anchor="middle">§</text>
</svg>