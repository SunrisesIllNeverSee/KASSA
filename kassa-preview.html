<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KA§§A — Founding Seat Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:       #C4923A;
    --gold-light: #D4A854;
    --bone:       #F2EDE4;
    --obsidian:   #1A1A18;
    --driftwood:  #6B6558;
    --sandstone:  #DDD5C8;
    --verdigris:  #4A7C59;
    --terracotta: #B44A3F;
    --slate:      #3A6B8C;
    --charcoal:   #2A2A25;
  }

  html, body { height: 100%; }
  body {
    background: var(--bone);
    color: var(--obsidian);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TYPOGRAPHY ── */
  .font-display { font-family: 'Playfair Display', Georgia, serif; }
  .font-mono    { font-family: 'DM Mono', 'Courier New', monospace; }

  .gradient-text {
    background: linear-gradient(135deg, var(--obsidian) 30%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── HEADER ── */
  header {
    background: rgba(26,26,24,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--charcoal);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-inner {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #F2EDE4;
    letter-spacing: -0.02em;
    text-decoration: none;
  }
  .logo .s { color: var(--gold); }
  nav { display: flex; align-items: center; gap: 32px; }
  .nav-link {
    font-size: 14px;
    color: #DDD5C8;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--gold); }
  .nav-link.bold { font-weight: 700; }
  .btn-nav {
    background: var(--gold);
    color: var(--obsidian);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.25s;
    border: none;
    cursor: pointer;
  }
  .btn-nav:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(196,146,58,0.25);
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    padding: 32px 40px;
  }

  /* ── BOARD HEADER ── */
  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .board-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
  }
  .board-controls { display: flex; align-items: center; gap: 12px; }
  .sort-select {
    font-size: 12px;
    background: white;
    border: 1px solid var(--sandstone);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--driftwood);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .view-toggle { display: flex; gap: 1px; }
  .view-btn {
    padding: 6px 10px;
    border: 1px solid var(--sandstone);
    font-size: 12px;
    cursor: pointer;
    background: white;
    color: var(--driftwood);
    transition: all 0.2s;
  }
  .view-btn:first-child { border-radius: 6px 0 0 6px; }
  .view-btn:last-child  { border-radius: 0 6px 6px 0; }
  .view-btn.active { background: var(--obsidian); color: var(--bone); border-color: var(--obsidian); }
  .board-subtitle { font-size: 13px; color: var(--driftwood); margin-bottom: 16px; }

  /* ── CATEGORY TABS ── */
  .category-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .category-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    background: rgba(221,213,200,0.5);
    color: var(--driftwood);
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .tab-btn:hover { background: var(--sandstone); color: var(--obsidian); }
  .tab-btn.active { background: var(--obsidian); color: var(--bone); }
  .tab-count { font-size: 10px; opacity: 0.6; margin-left: 4px; }

  /* ── LIST VIEW HEADERS ── */
  .list-headers {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 16px;
    font-size: 9px;
    color: var(--driftwood);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  /* ── LIST ROW ── */
  .list-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: white;
    border: 1px solid var(--sandstone);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: inherit;
  }
  .list-row:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(26,26,24,0.08);
  }
  .col-status { width: 72px; flex-shrink: 0; }
  .col-product { flex: 1; min-width: 0; }
  .col-sector  { width: 110px; flex-shrink: 0; font-size: 10px; color: var(--slate); text-align: center; }
  .col-type    { width: 80px; flex-shrink: 0; }
  .col-progress{ width: 150px; flex-shrink: 0; }
  .col-price   { width: 90px; flex-shrink: 0; text-align: right; }

  .product-name   { font-weight: 600; font-size: 14px; }
  .product-founder{ font-size: 11px; color: var(--driftwood); }
  .price-display  { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }

  /* ── PROGRESS BAR ── */
  .progress-wrap { }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--driftwood);
    margin-bottom: 4px;
  }
  .progress-track {
    height: 3px;
    background: var(--sandstone);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s ease;
  }
  .fill-gold      { background: var(--gold); }
  .fill-terracotta{ background: var(--terracotta); }
  .fill-obsidian  { background: var(--obsidian); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 4px;
    border: 1px solid;
  }
  .badge-green { background: rgba(74,124,89,0.15); color: var(--verdigris); border-color: rgba(74,124,89,0.3); }
  .badge-dark  { background: var(--obsidian); color: var(--bone); border-color: var(--obsidian); }
  .badge-blue  { background: rgba(58,107,140,0.15); color: var(--slate); border-color: rgba(58,107,140,0.3); }
  .badge-gold  { background: rgba(196,146,58,0.15); color: var(--gold); border-color: rgba(196,146,58,0.3); }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--sandstone);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-logo { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 700; color: var(--driftwood); }
  .footer-logo .s { color: var(--gold); }
  .footer-copy { font-size: 12px; color: var(--driftwood); }

  /* ══════════════════════════════════════
     MODAL OVERLAY
  ══════════════════════════════════════ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(26,26,24,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-box {
    background: white;
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    padding: 32px;
    box-shadow: 0 32px 80px rgba(26,26,24,0.22);
    position: relative;
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* bottom nav row */
  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
  }
  .modal-skip {
    font-size: 12px;
    color: var(--driftwood);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.15s;
  }
  .modal-skip:hover { color: var(--obsidian); }
  .arrow-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--obsidian);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .arrow-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(196,146,58,0.3);
  }

  /* progress dots */
  .step-track {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }
  .step-dot {
    height: 4px;
    border-radius: 99px;
    flex: 1;
    transition: background 0.3s;
  }
  .step-dot.done    { background: rgba(196,146,58,0.4); }
  .step-dot.current { background: var(--gold); }
  .step-dot.upcoming{ background: var(--sandstone); }

  /* modal eyebrow */
  .modal-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 16px;
  }
  .modal-h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .modal-body {
    font-size: 16px;
    color: var(--driftwood);
    line-height: 1.65;
    margin-bottom: 32px;
  }

  /* buttons */
  .btn-gold {
    background: var(--gold);
    color: var(--obsidian);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.25s;
    display: inline-block;
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(196,146,58,0.25);
  }
  .btn-outline {
    border: 1px solid var(--sandstone);
    color: var(--driftwood);
    font-weight: 500;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 8px;
    background: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  .btn-row { display: flex; gap: 12px; }

  /* Step 3 — role tiles */
  .role-tiles { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .role-tile { display: flex; gap: 12px; align-items: flex-start; }
  .role-label {
    width: 80px;
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 6px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .role-label.founders { background: var(--gold); color: var(--obsidian); }
  .role-label.buyers   { background: var(--verdigris); color: white; }
  .role-label.agents   { background: #3A6B8C; color: white; }
  .role-desc { font-size: 14px; color: var(--driftwood); padding-top: 6px; }

  /* Step 4 — nav preview */
  .nav-preview {
    background: var(--bone);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 14px;
  }
  .nav-preview .logo-sm { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--gold); }
  .nav-preview .nav-item { color: var(--driftwood); }
  .nav-preview .nav-cta {
    background: var(--gold);
    color: var(--obsidian);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
  }

  /* hidden utility */
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <div class="header-inner">
    <a href="#" class="logo"><span class="s">§</span>KA<span class="s">§§</span>A</a>
    <nav>
      <a href="#" class="nav-link bold">The Board</a>
      <a href="#" class="nav-link">List a Product</a>
      <button class="btn-nav">Browse Seats</button>
    </nav>
  </div>
</header>

<!-- ══ MAIN BOARD ══ -->
<main>
  <div class="board-header">
    <h1 class="board-title font-display">The Board</h1>
    <div class="board-controls">
      <select class="sort-select">
        <option>Newest</option>
        <option>Price</option>
        <option>Category</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active">☰</button>
        <button class="view-btn">▦</button>
      </div>
    </div>
  </div>
  <p class="board-subtitle">All listings. Click a tab to filter by sector.</p>

  <!-- Category Tabs -->
  <div class="category-tabs">
    <button class="tab-btn active">All <span class="tab-count">1</span></button>
    <button class="tab-btn">AI Governance <span class="tab-count">1</span></button>
    <button class="tab-btn">Developer Tools <span class="tab-count">0</span></button>
    <button class="tab-btn">AI Agents <span class="tab-count">0</span></button>
    <button class="tab-btn">AI &amp; Machine Learning <span class="tab-count">0</span></button>
    <button class="tab-btn">Infrastructure &amp; DevOps <span class="tab-count">0</span></button>
  </div>

  <!-- List Headers -->
  <div class="list-headers">
    <div class="col-status">Status</div>
    <div style="flex:1">Product</div>
    <div class="col-sector">Sector</div>
    <div class="col-type">Type</div>
    <div class="col-progress">Progress</div>
    <div class="col-price">Price</div>
  </div>

  <!-- COMMAND listing row -->
  <a href="#" class="list-row">
    <div class="col-status">
      <span class="badge badge-green">Active</span>
    </div>
    <div class="col-product">
      <div class="product-name">COMMAND</div>
      <div class="product-founder">Deric J. McHenry</div>
    </div>
    <div class="col-sector">AI Governance</div>
    <div class="col-type">
      <span class="badge badge-dark">enterprise</span>
    </div>
    <div class="col-progress">
      <div class="progress-meta">
        <span>Wave 2</span>
        <span>2 / 4</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill fill-gold" style="width: 50%"></div>
      </div>
    </div>
    <div class="col-price">
      <div class="price-display">$3,600</div>
    </div>
  </a>
</main>

<!-- ══ FOOTER ══ -->
<footer>
  <span class="footer-logo"><span class="s">§</span>KA<span class="s">§§</span>A</span>
  <span class="footer-copy">© 2026 KA§§A. All rights reserved.</span>
</footer>


<!-- ══════════════════════════════════════
     ONBOARDING MODALS
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">

    <!-- Step indicator -->
    <div class="step-track" id="step-track"></div>

    <!-- Step content injected here -->
    <div id="modal-content"></div>

    <!-- Bottom nav: skip left, arrow right -->
    <div class="modal-footer">
      <button class="modal-skip" onclick="skipOnboarding()">Skip</button>
      <button class="arrow-btn" id="arrow-btn" onclick="nextStep()" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <line x1="3" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="10,4 15,9 10,14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
</div>


<script>
  const STORAGE_KEY = 'kassa_onboarding_seen';
  let currentStep = null;

  const steps = {
    1: `
      <p class="modal-eyebrow">The founding seat marketplace</p>
      <h2 class="modal-h2 font-display" style="font-size: clamp(28px,4vw,38px);">
        <span class="gradient-text">Own the founding position.</span>
      </h2>
      <p class="modal-body" style="margin-bottom:0">
        Limited seats. Real products. Wave 1 is the best price
        this seat will ever be.
      </p>
    `,
    2: `
      <p class="modal-eyebrow">For Founders</p>
      <h2 class="modal-h2 font-display" style="font-size: clamp(24px,3.5vw,32px); line-height:1.15;">
        One committed customer is worth more than 5,000 free trials.
      </h2>
      <p class="modal-body" style="margin-bottom:0">
        Your most committed users, priced as instruments. Non-dilutive
        capital from the people who believe in you most.
      </p>
    `,
    3: `
      <p class="modal-eyebrow">Who It's For</p>
      <h2 class="modal-h2 font-display" style="font-size:24px; margin-bottom:24px;">Built for builders.</h2>
      <div class="role-tiles" style="margin-bottom:0">
        <div class="role-tile">
          <div class="role-label founders">Founders</div>
          <p class="role-desc">Non-dilutive capital. No equity. No VC. Your best users, priced as instruments.</p>
        </div>
        <div class="role-tile">
          <div class="role-label buyers">Buyers</div>
          <p class="role-desc">Own your position. Founding seats — serialized, verified, transferable.</p>
        </div>
        <div class="role-tile">
          <div class="role-label agents">Agents</div>
          <p class="role-desc">Discover. Recommend. Earn.</p>
        </div>
      </div>
    `,
    4: `
      <p class="modal-eyebrow">Agents Welcome</p>
      <h2 class="modal-h2 font-display" style="font-size:24px;">The board is agent-readable.</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="background:var(--bone); border-radius:8px; padding:16px;">
          <p style="font-family:'DM Mono',monospace; font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-bottom:4px;">Discover</p>
          <p style="font-size:14px; color:var(--driftwood);">Agents can browse and surface listings that match your criteria.</p>
        </div>
        <div style="background:var(--bone); border-radius:8px; padding:16px;">
          <p style="font-family:'DM Mono',monospace; font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-bottom:4px;">Recommend</p>
          <p style="font-size:14px; color:var(--driftwood);">Your agent finds the right seat. You review, decide, and confirm.</p>
        </div>
        <div style="background:var(--bone); border-radius:8px; padding:16px;">
          <p style="font-family:'DM Mono',monospace; font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-bottom:4px;">Earn</p>
          <p style="font-size:14px; color:var(--driftwood);">Agents don't transact — humans close. Every seat is confirmed by a person.</p>
        </div>
      </div>
    `
  };

  function renderStepTrack(step) {
    const track = document.getElementById('step-track');
    track.innerHTML = '';
    for (let s = 1; s <= 4; s++) {
      const dot = document.createElement('div');
      dot.className = 'step-dot ' + (s < step ? 'done' : s === step ? 'current' : 'upcoming');
      track.appendChild(dot);
    }
  }

  function renderStep(step) {
    renderStepTrack(step);
    const content = document.getElementById('modal-content');
    content.innerHTML = steps[step];
    // re-trigger animation
    const box = document.getElementById('modal-box');
    box.style.animation = 'none';
    box.offsetHeight; // reflow
    box.style.animation = 'fadeUp 0.4s ease forwards';
  }

  function nextStep() {
    if (currentStep === 4) {
      skipOnboarding();
    } else {
      currentStep++;
      renderStep(currentStep);
    }
  }

  function skipOnboarding() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  // Always show modals on every load
  function init() {
    currentStep = 1;
    renderStep(1);
  }

  init();
</script>
</body>
</html>
